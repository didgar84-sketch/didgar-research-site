<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title description"><title id="title">Six descriptive paths on synthetic data</title><desc id="description">OLS coefficients for study hours under three illustrative quality rules and two specifications. No real participants, confidence intervals or causal claims.</desc><rect width="960" height="560" fill="#f8fafb"/><g font-family="Arial,sans-serif" fill="#122d40"><text x="36" y="45" font-size="24">Six descriptive paths · synthetic teaching data</text><text x="36" y="76" font-size="15">Point estimates only; choices are illustrative, not a validated specification-curve test.</text><line x1="420.000" x2="420.000" y1="110" y2="450" stroke="#dbe3e9"/><text x="420.000" y="480" font-size="14" text-anchor="middle">0.00</text><line x1="537.500" x2="537.500" y1="110" y2="450" stroke="#dbe3e9"/><text x="537.500" y="480" font-size="14" text-anchor="middle">0.94</text><line x1="655.000" x2="655.000" y1="110" y2="450" stroke="#dbe3e9"/><text x="655.000" y="480" font-size="14" text-anchor="middle">1.89</text><line x1="772.500" x2="772.500" y1="110" y2="450" stroke="#dbe3e9"/><text x="772.500" y="480" font-size="14" text-anchor="middle">2.83</text><line x1="890.000" x2="890.000" y1="110" y2="450" stroke="#dbe3e9"/><text x="890.000" y="480" font-size="14" text-anchor="middle">3.77</text><text x="36" y="135" font-size="15">all / unadjusted (n=12)</text><circle cx="865.086" cy="130" r="7" fill="#123349"/><text x="915" y="135" font-size="14" text-anchor="end">3.573</text><text x="36" y="190" font-size="15">all / baseline_adjusted (n=12)</text><circle cx="820.388" cy="185" r="7" fill="#725221"/><text x="915" y="190" font-size="14" text-anchor="end">3.214</text><text x="36" y="245" font-size="15">exclude_A / unadjusted (n=10)</text><circle cx="836.871" cy="240" r="7" fill="#123349"/><text x="915" y="245" font-size="14" text-anchor="end">3.346</text><text x="36" y="300" font-size="15">exclude_A / baseline_adjusted (n=10)</text><circle cx="854.287" cy="295" r="7" fill="#725221"/><text x="915" y="300" font-size="14" text-anchor="end">3.486</text><text x="36" y="355" font-size="15">exclude_A_B / unadjusted (n=8)</text><circle cx="842.274" cy="350" r="7" fill="#123349"/><text x="915" y="355" font-size="14" text-anchor="end">3.390</text><text x="36" y="410" font-size="15">exclude_A_B / baseline_adjusted (n=8)</text><circle cx="796.610" cy="405" r="7" fill="#725221"/><text x="915" y="410" font-size="14" text-anchor="end">3.023</text><text x="650" y="520" text-anchor="middle" font-size="17">Score points per study hour (OLS coefficient)</text></g></svg>